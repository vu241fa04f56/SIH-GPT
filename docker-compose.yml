
services:
  # ─── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: weathergpt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: weathergpt_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://weathergpt:password@db:5432/weathergpt
      SYNC_DATABASE_URL: postgresql://weathergpt:password@db:5432/weathergpt
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:8001"]'
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./geo_data:/app/geo_data
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Chatbot Service ───────────────────────────────────────────────────────
  chatbot:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.chatbot
    container_name: weathergpt_chatbot
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8001:8001"
    volumes:
      - .:/app

  # ─── Data Pipeline Scheduler ──────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: weathergpt_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://weathergpt:password@db:5432/weathergpt
      SYNC_DATABASE_URL: postgresql://weathergpt:password@db:5432/weathergpt
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    command: python -m data_pipeline.ingestion.scheduler
    volumes:
      - ./models:/app/models
      - .:/app

  # ─── React Frontend (served by nginx) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws
    container_name: weathergpt_frontend
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  pgdata:
